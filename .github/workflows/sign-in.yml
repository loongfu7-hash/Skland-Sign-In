name: Skland Sign In

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. This is 01:00 in Asia/Shanghai.
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: skland-sign-in
  cancel-in-progress: false

jobs:
  sign-in:
    name: Run sign-in
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai
      # 强制使用 Node.js 24 运行官方 Actions 插件，以消除 Node.js 20 弃用警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write config
        env:
          SKLAND_CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          python - <<'PY'
          import os
          import sys
          import re
          import yaml

          config = os.environ.get("SKLAND_CONFIG_YAML", "")
          if not config.strip():
              sys.exit("GitHub Secret CONFIG_YAML is empty. Add your config.yaml content as a repository secret.")

          parsed = yaml.safe_load(config)
          if not isinstance(parsed, dict):
              sys.exit("CONFIG_YAML must be a YAML mapping.")
          if not parsed.get("users"):
              sys.exit("CONFIG_YAML must contain at least one user under users.")

          with open("config.yaml", "w", encoding="utf-8") as f:
              f.write(config)
              if not config.endswith("\n"):
                  f.write("\n")

          # 按 nickname_seq.txt 拼接显示昵称（序号 0 不加后缀）
          try:
              with open("nickname_seq.txt", encoding="utf-8") as sf:
                  seq = sf.read().strip()
              suffix = "" if seq == "0" else seq
              nickname = "魂有栖" + suffix
              with open("config.yaml", encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(r'(nickname:\s*").*(")',
                            lambda m: m.group(1) + nickname + m.group(2),
                            text, count=1)
              with open("config.yaml", "w", encoding="utf-8") as f:
                  f.write(text)
          except FileNotFoundError:
              pass
          PY

      - name: Run sign-in
        run: python main.py
