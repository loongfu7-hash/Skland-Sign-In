name: Monthly Nickname Bump

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 UTC 16:00（北京时间 00:00）
    - cron: "0 16 1 * *"

permissions:
  contents: write

jobs:
  bump:
    name: Bump nickname sequence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump sequence number
        id: bump
        run: |
          SEQ=$(tr -d '[:space:]' < nickname_seq.txt)
          SEQ=$((SEQ + 1))
          echo "$SEQ" > nickname_seq.txt
          echo "seq=$SEQ" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nickname_seq.txt
          git commit -m "chore: bump nickname sequence to ${{ steps.bump.outputs.seq }}"
          git push
